name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test TriuneLogParser.sln -c Release

      - name: Publish CLI (standalone single-file win-x64)
        run: >
          dotnet publish src/TriuneLogParser.Cli -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.v }}
          -o dist/cli

      - name: Publish desktop app (standalone single-file win-x64)
        run: >
          dotnet publish src/TriuneLogParser.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.v }}
          -o dist/app

      - name: Stage release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/app/TriuneLogParser.exe "out/TriuneLogParser-$tag-win-x64.exe"
          Copy-Item dist/cli/triuneparse.exe    "out/triuneparse-$tag-win-x64.exe"
          Copy-Item CHANGELOG.md                "out/CHANGELOG.md"
          Get-FileHash out/*.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-ChildItem out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          make_latest: true
          body: |
            Standalone Windows x64 builds — no .NET install required.

            - `TriuneLogParser-*.exe` — desktop app (parser + overlay)
            - `triuneparse-*.exe` — command-line parser
            - `SHA256SUMS.txt` — verify with `Get-FileHash <file> -Algorithm SHA256`

            The exe is unsigned, so Windows SmartScreen shows an "unrecognized app"
            prompt on first run — choose **More info → Run anyway**.

            See [CHANGELOG.md](CHANGELOG.md) for what changed.
